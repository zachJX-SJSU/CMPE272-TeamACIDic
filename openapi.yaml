components:
  schemas:
    Issue:
      type: object
      properties:
        number: { type: integer, description: "The issue number from GitHub" }
        # ... and other required properties (html_url, state, title, body, labels, created_at, updated_at)
    Error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        # ...
    Comment: # New schema for issue comments
      type: object
      properties:
        id: { type: integer }
        body: { type: string }
        user: { type: object, description: "Simplified user object." }
        created_at: { type: string, format: date-time }
        
    Event: # New schema for stored events
      type: object
      properties:
        id: { type: integer }
        type: { type: string, description: "The X-GitHub-Event type." }
        payload: { type: object, description: "The raw payload data." }
        received_at: { type: string, format: date-time }
        processed: { type: boolean }

  securitySchemes:
    bearerAuth: # This is the scheme we're defining for server-side auth
      type: http
      scheme: bearer
      bearerFormat: JWT/PAT (Used internally by the gateway)