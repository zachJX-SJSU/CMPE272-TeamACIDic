# openapi.yaml (Excerpt - you need to complete the full file)

paths:
  /issues:
    post:
      summary: Create a new GitHub issue
      operationId: createIssue
      security:
        # Indicates this route requires server-side auth (to GitHub)
        - bearerAuth: [] 
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, description: "Title of the issue." }
                body: { type: string, description: "Body/description of the issue." }
                labels: { type: array, items: { type: string } }
            example:
              title: "Bug: Login button is broken"
              body: "When clicking the login button, nothing happens."
              labels: ["bug", "priority: high"]
      responses:
        '201':
          description: Issue created successfully
          headers:
            Location: { schema: { type: string }, description: "URL to the newly created resource, e.g., /issues/123" }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Issue' }
              # ... include a 201 example here
              example: # <-- ADD THIS BLOCK
                id: 1234567890
                number: 42
                html_url: "https://github.com/owner/repo/issues/42"
                state: "open"
                title: "Bug: Login button is broken"
                body: "When clicking the login button, nothing happens."
                user: # Referencing the User schema
                  login: "zachJX-SJSU"
                  id: 987654321
                  html_url: "https://github.com/zachJX-SJSU"
                labels: 
                  - name: "bug"
                  - name: "priority: high"
                created_at: "2025-09-26T20:00:00Z"
                updated_at: "2025-09-26T20:00:00Z"
        '400':
          description: Invalid payload (e.g., missing title)
          content:
            application/json: { $ref: '#/components/schemas/Error' }
  /issues:
    get: # <-- Add the GET method here
      summary: List all GitHub issues
      operationId: listIssues
      security:
        - bearerAuth: [] 
      parameters:
        - name: state
          in: query
          description: Filter issues by state (open or closed)
          schema:
            type: string
            enum: [open, closed, all]
            default: open
      responses:
        '200':
          description: Successfully retrieved list of issues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Issue'
              example: # <-- ADD THIS BLOCK
                - id: 1234567890
                  number: 42
                  html_url: "https://github.com/owner/repo/issues/42"
                  state: "open"
                  title: "Bug: Login button is broken"
                  body: "When clicking the login button, nothing happens."
                  user: # Simplified User reference
                    login: "zachJX-SJSU"
                    id: 987654321
                  labels: 
                    - name: "bug"
                  created_at: "2025-09-26T20:00:00Z"
                  updated_at: "2025-09-26T20:00:00Z"
                - id: 1234567891
                  number: 43
                  html_url: "https://github.com/owner/repo/issues/43"
                  state: "closed"
                  title: "Feature Request: Add dark mode"
                  body: "A dark theme would be nice."
                  user:
                    login: "anotheruser"
                    id: 987654322
                  labels: 
                    - name: "enhancement"
                  created_at: "2025-09-25T10:00:00Z"
                  updated_at: "2025-09-26T15:00:00Z"
            
  /issues/{number}:
    parameters:
      - name: number
        in: path
        required: true
        description: The issue number from GitHub.
        schema:
          type: integer
          
    get: # READ a specific issue
      summary: Retrieve a specific GitHub issue
      operationId: getIssue
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Issue retrieved successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Issue' }
        '404':
          description: Issue not found
          content:
            application/json: { $ref: '#/components/schemas/Error' }
            
    patch: # UPDATE a specific issue (e.g., closing it)
      summary: Update an existing GitHub issue
      operationId: updateIssue
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, description: "New title for the issue." }
                body: { type: string, description: "New body/description for the issue." }
                state: { type: string, enum: [open, closed], description: "Set the issue state (e.g., to 'closed')." }
            example: # <-- ADDED REQUEST EXAMPLE
              state: "closed"
              title: "Fixed: Login button is now operational"
      responses:
        '200':
          description: Issue updated successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Issue' }
              example: # <-- ADDED RESPONSE EXAMPLE
                id: 1234567890
                number: 42
                html_url: "https://github.com/owner/repo/issues/42"
                state: "closed" # State is now closed
                title: "Fixed: Login button is now operational" # New title
                body: "When clicking the login button, nothing happens."
                user: 
                  login: "zachJX-SJSU"
                  id: 987654321
                labels: 
                  - name: "bug"
                created_at: "2025-09-26T20:00:00Z"
                updated_at: "2025-09-26T21:05:00Z" # Updated timestamp
  /issues/{number}/comments:
    parameters:
      - name: number
        in: path
        required: true
        description: The issue number to comment on.
        schema:
          type: integer
          
    post: # CREATE a new comment on an issue
      summary: Create a comment on a GitHub issue
      operationId: createComment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, description: "The content of the comment." }
            example:
              body: "Thanks for reporting this! We'll look into it."
      responses:
        '201':
          description: Comment created successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
              example: # <-- ADDED RESPONSE EXAMPLE
                id: 500
                html_url: "https://github.com/owner/repo/issues/42#issuecomment-500"
                issue_url: "https://api.github.com/repos/owner/repo/issues/42"
                body: "Thanks for reporting this! We'll look into it."
                user:
                  login: "zachJX-SJSU"
                  id: 987654321
                created_at: "2025-09-26T21:10:00Z"
  /webhook:
    post: # RECEIVE GitHub Webhook events
      summary: GitHub Webhook Listener
      operationId: handleWebhookEvent
      requestBody:
        required: true
        content:
          # GitHub typically sends a generic JSON payload
          application/json:
            schema:
              type: object
              description: The full GitHub event payload (e.g., issue, pull request, etc.)
      # We define expected headers for security and event type
      parameters:
        - name: X-GitHub-Event
          in: header
          required: true
          description: The type of event (e.g., 'issues', 'pull_request').
          schema:
            type: string
        - name: X-Hub-Signature-256
          in: header
          required: true
          description: HMAC hex digest used for security verification.
          schema:
            type: string
            
      responses:
        '200':
          description: Webhook received and processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "success" }
        '403':
          description: Forbidden (HMAC signature failed)
          content:
            application/json: { $ref: '#/components/schemas/Error' }
  /events:
    get: # READ a list of stored events
      summary: Retrieve a list of stored GitHub events
      operationId: listEvents
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of events retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
